<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>GameStop02 — استغلال ويب PS4 للإصدارات 7.00 إلى 14.00</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "يعمل هذا المضيف على PS4 بإصدار النظام 5.05 أو من 7.00 إلى 14.00 فقط";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 14.00) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=19";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum == 14.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb2.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>
<h1 class="page-title"><span class="rainbow-brand">GameStop02</span> — استغلال ويب PS4 للإصدارات 7.00 إلى 14.00</h1>
<hr>
<br>
<h1 id=msgs style="font-size: 30px;margin-top: 77px;margin-bottom: 455px;">جارٍ تحميل GoldHEN v2.4b18.13... يُرجى الانتظار</h1>
<div id="exploit-progress" role="progressbar" aria-label="تقدم العملية" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="exploit-progress-bar"></div></div>
<script>
(function () {
  var message = document.getElementById("msgs");
  var bar = document.getElementById("exploit-progress-bar");
  var progress = document.getElementById("exploit-progress");
  if (!message || !bar || !progress) return;
  var translations = [
    [/Starting Cache Installation\.\.\./i, "جارٍ بدء تثبيت ذاكرة التخزين المؤقت..."],
    [/Installing Offline Cache:\s*(\d+)%/i, "جارٍ تثبيت ذاكرة التخزين المؤقت: $1٪"],
    [/Cache Installed Successfully\s*✔/i, "تم تثبيت ذاكرة التخزين المؤقت بنجاح ✔"],
    [/Now Close And Re-Open Your Browser/i, "أغلق المتصفح ثم أعد فتحه"],
    [/Error Installing Cache!.*$/i, "حدث خطأ أثناء تثبيت ذاكرة التخزين المؤقت. امسح بيانات المتصفح وأعد فتحه."],
    [/Loading GoldHEN.*Please Wait/i, "جارٍ تحميل GoldHEN... يُرجى الانتظار"],
    [/GoldHEN v2\.4b18\.13 Loaded\s*\.\.\./i, "تم تحميل GoldHEN v2.4b18.13 بنجاح"],
    [/GoldHEN is Already Loaded\s*\.\.\./i, "تم تحميل GoldHEN مسبقًا"],
    [/Failed to Load! Restart Your Console.*$/i, "تعذر التحميل. أعد تشغيل جهازك وحاول مجددًا."],
    [/Content not Found!.*$/i, "لم يتم العثور على المحتوى. امسح بيانات المتصفح وأعد تثبيت ذاكرة التخزين المؤقت."],
    [/Only for PS4 with Firmware (.*)/i, "لجهاز PS4 بإصدار النظام $1"],
    [/Unsupported Firmware:\s*(.*)/i, "إصدار النظام غير مدعوم: $1"]
  ];
  function update() {
    var original = message.textContent.trim();
    var percentMatch = original.match(/(\d+)[%٪]/);
    var translated = original;
    for (var i = 0; i < translations.length; i++) {
      if (translations[i][0].test(original)) { translated = original.replace(translations[i][0], translations[i][1]); break; }
    }
    if (translated !== original) message.textContent = translated;
    if (percentMatch) {
      var percent = Math.max(0, Math.min(100, Number(percentMatch[1])));
      bar.style.width = percent + "%";
      progress.setAttribute("aria-valuenow", String(percent));
      progress.classList.remove("is-indeterminate", "is-error");
    } else if (/loaded successfully|already loaded|installed successfully|تم تحميل|تم تثبيت/i.test(translated)) {
      bar.style.width = "100%";
      progress.setAttribute("aria-valuenow", "100");
      progress.classList.remove("is-indeterminate", "is-error");
    } else if (/error|failed|تعذر|خطأ|لم يتم العثور/i.test(translated)) {
      bar.style.width = "100%";
      progress.classList.remove("is-indeterminate");
      progress.classList.add("is-error");
    } else {
      progress.classList.add("is-indeterminate");
      progress.classList.remove("is-error");
      progress.removeAttribute("aria-valuenow");
    }
  }
  message.setAttribute("dir", "rtl");
  new MutationObserver(update).observe(message, { childList: true, characterData: true, subtree: true });
  update();
})();
</script>


</body>
</html>
